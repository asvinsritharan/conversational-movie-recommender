model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
train: true
data: "data/finetune"


adapter_path: "adapters/explainer_8L_r8"
fine_tune_type: lora


num_layers: 8 
batch_size: 2
max_seq_length: 512
iters: 600
learning_rate: 1.0e-4
grad_checkpoint: true


lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0


save_every: 100
steps_per_eval: 100